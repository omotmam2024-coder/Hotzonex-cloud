version: '3.8'
services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hotzonex
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: replace-with-a-32-byte-key
      JWT_SECRET: replace-with-a-strong-jwt-secret
      SESSION_SECRET: replace-with-a-strong-session-secret
      MIKROTIK_PROVIDER: mock
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hotzonex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - '6379:6379'
volumes:
  pgdata:
